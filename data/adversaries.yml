  - costrutto
  - volante
  - pietra
  moves:
  - name: Caduta di pietra
    text: Piomba da Lontano, infligge danno e spinge il bersaglio.
  - name: Mimetismo
    text: Immobile è indistinguibile da una statua ordinaria.
  - name: Ruggito minerale
    text: Chi è Vicino deve Resistere +CUO o diventa Stordito.
  weakness: Acqua consacrata e vibrazioni profonde spezzano la pietra; un comando autentico della Madonnina lo arresta.
  behavior: Non insegue lontano dal territorio e interpreta gli ordini in modo letterale.
