schema_version: 1
product_version: 0.9.0-beta.2
adversaries:
- name: Zombie
  pf: 8
  armor: 0
  damage: 1d6 fisico
  ls: 1
  type: Non morto / Minion
  description: Un cadavere animato, lento e insensibile al dolore.
  impulse: Afferrare i viventi e trascinarli verso il proprio creatore.
  tags:
  - lento
  - non morto
  - instancabile
  moves:
  - name: Presa dei morti
    text: Quando infligge danno a Contatto, trattiene il bersaglio; liberarsi richiede Sfidare il Pericolo +FOR.
  - name: Avanzata inesorabile
    text: Ignora paura, dolore e ferite non distruttive; attraversa ostacoli fragili senza rallentare.
  - name: Massa di corpi
    text: Tre o più zombie possono agire come un gruppo e infliggere il danno una sola volta ad area Vicino.
  weakness: Fuoco o decapitazione impediscono che si rialzi; luce consacrata lo respinge.
  behavior: Obbedisce a ordini semplici. Senza padrone segue rumori, calore e movimento.
  hook: Da un cantiere di CityLife emergono cadaveri senza un necromante visibile.
- name: Ragno d'Ombra
  pf: 6
  armor: 1
  damage: 1d4 fisico + veleno
  ls: 1
  type: Ombra / Minion
  description: Un aracnide grande come un cane, tessuto di oscurità solida.
  impulse: Isolare una preda e avvolgerla prima che il gruppo reagisca.
  tags:
  - ombra
  - velenoso
  - arrampicatore
  moves:
  - name: Mimetismo
    text: Nel buio è invisibile finché non si muove apertamente o attacca.
  - name: Tela nera
    text: Annuncia una ragnatela a Vicino; se ignorata, un bersaglio diventa Immobilizzato.
  - name: Veleno freddo
    text: Chi subisce danno deve Resistere +FOR o ottiene la Condizione Debilitato.
  weakness: Luce intensa elimina il mimetismo; il fuoco ignora la sua Armatura.
  behavior: Caccia dai soffitti, fugge dalla luce e protegge le proprie uova.
  hook: Un senzatetto viene trovato avvolto in seta nera sotto Porta Ticinese.
- name: Imp
