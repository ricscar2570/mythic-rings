  armor: 2
  damage: 2d10 fisico
  ls: 7
  type: Non morto / Elite
  description: Un cavaliere senza testa che percorre tangenziali e cavalcavia su una moto nera.
  impulse: Pronunciare il nome della vittima e separarla dal proprio futuro.
  tags:
  - non morto
  - rapido
  - presagio
  moves:
  - name: Catena del cavalcavia
    text: A Lontano avvolge e trascina un bersaglio verso un bordo o un veicolo.
