  armor: 0
  damage: 1d4 magico
  ls: 1
  type: Spirito / Minion
  description: Un ratto trasparente dagli occhi rossi, attratto dai residui di magia.
  impulse: Nutrire lo sciame e seguire la fonte soprannaturale più intensa.
  tags:
  - incorporeo
  - sciame
  - spettrale
  moves:
  - name: Attraversare
    text: Passa attraverso pareti e grate non consacrate.
  - name: Sciamare
    text: Cinque o più ratti diventano una singola minaccia da 15 PF e danno 2d4 ad area.
  - name: Incubi contagiosi
    text: Chi viene morso deve Resistere +MEN o subisce 1 Stress al prossimo riposo.
  weakness: Sale e cerchi consacrati bloccano il passaggio; la magia infligge danno normalmente.
  behavior: Evita lo scontro isolato e si riversa nei tunnel quando percepisce un portale.
  hook: I macchinisti della M2 vedono decine di luci rosse correre davanti ai treni.
- name: Folletto di Sempione
