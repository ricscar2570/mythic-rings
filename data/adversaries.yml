  armor: 1
  damage: 2d8 fisico
  ls: 6
  type: Mostro / Forte
  description: Una fame soprannaturale che indossa un corpo umano consumato.
  impulse: Trasformare bisogno, solitudine e consumo in cannibalismo rituale.
  tags:
  - rapido
  - affamato
  - gelido
  moves:
