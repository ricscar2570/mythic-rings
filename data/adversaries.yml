  armor: 0
  damage: 1d4 magico
  ls: 1
  type: Demoniaco / Minion
  description: Un diavoletto alato, dispettoso, intelligente e profondamente codardo.
  impulse: Creare caos sufficiente perché il vero padrone possa agire.
  tags:
  - volante
  - demoniaco
  - furtivo
  moves:
  - name: Fiammata
    text: Incendia un oggetto o infligge il danno a Lontano.
  - name: Svanire
    text: Diventa invisibile fino a quando attacca, parla o attraversa luce consacrata.
  - name: Insulto infernale
    text: Provoca un Guardiano; se reagisce d’impulso, il Custode gli offre una scelta difficile.
  weakness: Acqua benedetta e argento infliggono +1d6 danno; un simbolo sacro brandito con convinzione lo costringe ad arretrare.
  behavior: Da solo tratta e fugge; in gruppo diventa temerario e crudele.
  hook: Un condominio ai Navigli è infestato da imp che rubano chiavi e aprono porte sigillate.
- name: Ratto Spettrale
