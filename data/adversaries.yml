  armor: 0
  damage: 1d6 fisico
  ls: 4
  type: Mutaforma / Comune
  description: Un predatore sociale che replica volto, voce e abitudini di chi osserva.
  impulse: Sostituire una persona e vivere abbastanza a lungo da rubarne i Legami.
  tags:
  - mutaforma
  - imitatore
  - sociale
  moves:
  - name: Volto rubato
    text: Assume l’aspetto di una persona osservata; dettagli intimi richiedono studio.
  - name: Memoria superficiale
    text: Dopo il contatto ottiene un ricordo recente utile a sostenere la finzione.
  - name: Dividere i sospetti
    text: Rivela una prova costruita che mette due alleati l’uno contro l’altro.
  weakness: Non replica Anelli, poteri o ricordi profondi; uno specchio d’argento mostra il volto originale.
  behavior: Evita il combattimento e fugge quando l’identità è compromessa.
