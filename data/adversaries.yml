  weakness: Distruggere il suo focus o costringerla fuori dal territorio riduce le sue Mosse a una sola.
  behavior: Negozia prima di combattere e prepara sempre una via di fuga.
  hook: Una strega chiede ai Custodi di eliminare il mostro che sta avvelenando il suo tratto di Naviglio.
- name: Doppelgänger
