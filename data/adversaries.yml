  armor: 0
  damage: 1d4 magico
  ls: 2
  type: Fatato / Minion
  description: Uno spirito naturale minuscolo, luminoso e sospettoso degli esseri umani.
  impulse: Proteggere il parco e punire chi spezza un patto.
  tags:
  - fatato
  - volante
  - illusorio
  moves:
  - name: Illusione minore
    text: Crea un suono o un’immagine che devia attenzione e percorsi.
  - name: Polline del sonno
    text: Chi resta nell’area deve Resistere +FOR o diventa Assonnato.
  - name: Tocco verde
    text: Cura 1d4 PF a una creatura naturale una sola volta per scena.
  weakness: Ferro freddo infligge +1d6 danno e interrompe le illusioni.
  behavior: Preferisce patti e scherzi; attacca soltanto se il parco o un giuramento sono minacciati.
  hook: I folletti offrono aiuto contro qualcosa che ha fatto tacere gli alberi del parco.
- name: Spettro
  pf: 15
  armor: 1
  damage: 1d8 magico
  ls: 3
  type: Non morto / Comune
  description: Uno spirito umano bloccato da un rimpianto, un luogo o un oggetto.
  impulse: Ripetere il trauma della propria morte finché qualcuno non lo riconosce.
  tags:
  - incorporeo
  - volante
  - gelido
  moves:
  - name: Tocco gelido
    text: Infligge il danno e può imporre la Condizione Terrorizzato.
  - name: Urlo del rimpianto
    text: Tutti a Vicino devono Resistere +CUO o fuggire, congelarsi o subire 1 Stress.
  - name: Passare oltre
    text: Attraversa muri e compare da un’ombra o da un ricordo legato al luogo.
  weakness: Risolvere il rimpianto lo placa; sale e luce consacrata ne limitano il movimento.
  behavior: Alterna gesti ripetitivi a esplosioni di rabbia; può comunicare se qualcuno ascolta.
  hook: Un partigiano al Monumentale cerca il discendente di chi lo tradì.
- name: Lupo Mannaro
  pf: 22
  armor: 1
  damage: 2d6 fisico
  ls: 4
  type: Mutaforma / Comune
  description: Un essere umano travolto da una forma predatoria enorme e territoriale.
  impulse: Difendere il territorio, cacciare il più vulnerabile e fuggire prima dell’alba.
  tags:
  - rapido
  - rigenerante
  - olfatto
  moves:
  - name: Rigenerazione
    text: Alla fine del round recupera 1d4 PF, salvo che abbia subito danno da argento.
  - name: Balzo predatorio
    text: Supera una fascia di distanza e separa un bersaglio dal gruppo.
  - name: Morso della luna
    text: Chi subisce danno deve Resistere +FOR o riceve una maledizione latente da trattare come minaccia di campagna.
  weakness: L’argento infligge +1d6 danno e blocca la rigenerazione per la scena; l’aconito impone Debilitato.
  behavior: In forma umana nasconde ferite e vuoti di memoria; trasformato insegue odore e paura.
  hook: Un professore si trasforma ogni luna piena senza ricordare ciò che ha fatto.
- name: Gargoyle del Duomo
